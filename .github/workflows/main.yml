name: 🚀 Deploy Website
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 📂 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐘 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Sesuaikan dengan versi PHP server Anda
          tools: composer:v2

      - name: 📦 Install PHP dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist --optimize-autoloader --no-dev

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: 📦 Install NPM dependencies
        run: npm ci

      - name: 🏗️ Build frontend assets
        run: npm run build

      - name: 🧹 Clean up unneeded files before upload
        run: |
          rm -rf node_modules
          rm -rf tests

      - name: 🚀 Sync via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            .git/**
            .github/**
            **/.env*
            **/database/*.sqlite
            composer.json
            composer.lock
            package.json
            package-lock.json
            vite.config.js
            README.md
            *.md
            .antigravity
            scratch/**
            load-test.js
            phpunit.xml
            .editorconfig
            .gitattributes
            debug_multitenant.php
            fix-theme.cjs
